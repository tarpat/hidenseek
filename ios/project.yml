# Generate the Xcode project with:  brew install xcodegen && xcodegen generate
name: HideNSeek
options:
  bundleIdPrefix: com.tarunpatanjali
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  HideNSeek:
    type: application
    platform: iOS
    sources: [HideNSeek]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tarunpatanjali.hidenseek
        PRODUCT_NAME: HideNSeek
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        # Set DEVELOPMENT_TEAM to your free "Personal Team" ID in Xcode (Signing & Capabilities).
    info:
      path: HideNSeek/Info.plist
      properties:
        CFBundleDisplayName: Hide n Seek
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: Hide n Seek shows your position to players in your game while a game is running.
        NSLocationAlwaysAndWhenInUseUsageDescription: Hide n Seek keeps sharing your position with your game while your phone is locked, only during an active game.
        NSPhotoLibraryAddUsageDescription: Hide n Seek can save the photos and videos shared in a game to your Photos library when the game ends.
        NSCameraUsageDescription: Hide n Seek uses the camera to take photos and videos to share in the game chat.
        NSMicrophoneUsageDescription: Hide n Seek records sound with videos you share in the game chat.
        CFBundleURLTypes:
          - CFBundleURLName: com.tarunpatanjali.hidenseek
            CFBundleURLSchemes: [hidenseek]
        NSLocalNetworkUsageDescription: Hide n Seek connects to a game server on your local network during development.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
